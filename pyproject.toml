[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "images23dgs"
version = "0.1.0"
description = "Image collection to DISCOVERSE/Real2Sim 3DGS pipeline with optional ArtiFixer sparse-view repair"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "d-robotics"}]
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
images23dgs = "images23dgs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["images23dgs*"]

[tool.setuptools.package-data]
"images23dgs.product" = ["static/*"]
